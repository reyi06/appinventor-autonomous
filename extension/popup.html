<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; background: #1a1a1a; color: #f2f2f2; }
    h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
    #status { padding: 8px; border-radius: 6px; background: #262626; margin-bottom: 10px; }
    .ok { color: #7ddc7d; }
    .bad { color: #ff8a80; }
    button { width: 100%; padding: 7px; border: 0; border-radius: 6px; background: #727f5c; color: #fff; cursor: pointer; }
    button:hover { background: #62704a; }
    .muted { color: #9e9e9e; font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>App Inventor Bridge</h1>
  <div id="status">Checking…</div>
  <button id="sweep">Re-attach relay</button>
  <div class="muted">Relay host: <span id="port"></span></div>
  <script src="popup.js"></script>
</body>
</html>
